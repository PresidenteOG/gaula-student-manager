# Render blueprint — https://render.com/docs/blueprint-spec
# One free Docker web service running the Spring Boot backend on the `demo`
# profile: in-memory H2, re-seeded on every start, no database add-on.
# The Flutter web client is hosted separately (GitHub Pages) — see DEPLOY.md.
services:
  - type: web
    name: gaula-student-manager
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /v3/api-docs
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: GAULA_JWT_SECRET
        generateValue: true
      # Optional: add CORS_ALLOWED_ORIGINS in the dashboard to pin the allowed
      # origin to the Flutter web URL (e.g. https://presidenteog.github.io).
      # Left unset, the demo profile allows any http/https origin.
