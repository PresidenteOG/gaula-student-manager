# ══════════════════════════════════════════════════════════════
# application-prod.properties — Perfil de PRODUCCIÓN
# ══════════════════════════════════════════════════════════════

# Pool de conexiones Hikari
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA Prod
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway Prod (seguro)
spring.flyway.enabled=true
spring.flyway.clean-on-validation-error=false
spring.flyway.baseline-on-migrate=true

# Datasource — obligatorio por variable de entorno en producción
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# CORS Prod — restríngelo a tu dominio de frontend
gaula.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# JWT — sin valor por defecto: la app no arranca sin GAULA_JWT_SECRET (mínimo 512 bits en Base64)
gaula.jwt.secret=${GAULA_JWT_SECRET}
gaula.jwt.expiration-ms=${GAULA_JWT_EXPIRATION_MS:86400000}

# Logging Prod
logging.level.root=INFO
logging.level.com.gaula=INFO
