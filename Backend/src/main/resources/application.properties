# ══════════════════════════════════════════════════════════════
# application.properties — Configuración General GAULA
# ══════════════════════════════════════════════════════════════

# Perfil activo. Añade ",local" y crea application-local.properties (gitignored)
# para tus credenciales de desarrollo.
spring.profiles.active=dev

# Configuración de base de datos general.
# Todos los valores vienen de variables de entorno — no hay credenciales en el repo.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gaula?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# spring.jpa.properties.hibernate.dialect removed to allow autodetection

# Configuración JWT (Gaula Custom)
gaula.jwt.secret=${GAULA_JWT_SECRET}
gaula.jwt.expiration-ms=86400000

# Jackson — ISO-8601 timestamps, strip nulls from payloads
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Europe/Madrid

# Optimización: Compresión GZIP (Reduce uso de ancho de banda)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Seguridad: Desactivar show-sql en producción (Previene fugas de datos en logs)
spring.jpa.show-sql=false

# Nager Date API (Holidays)
gaula.nager.base-url=${GAULA_NAGER_BASE_URL:https://date.nager.at/api/v3}

# Configuración de subida de archivos (10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Directorio físico de subida de archivos (fotos de perfil, etc.)
# Ruta relativa al directorio de trabajo del backend (Backend/, donde corre
# spring-boot:run): ../uploads → C:\Dev\GAULA\uploads. Las fotos van a
# uploads/profiles y se sirven en /uploads/** (handler en WebConfig.java).
file.upload-dir=../uploads

# CORS (SEGURIDAD: Evitar '*' en producción si es posible)
gaula.cors.allowed-origins=*

# HikariCP connection pool tuning (Aiven MySQL via SSL)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=GaulaHikariPool
spring.datasource.hikari.auto-commit=true

# Optimización Hibernate: Batching (Mejora rendimiento en importación de backups)
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=100
