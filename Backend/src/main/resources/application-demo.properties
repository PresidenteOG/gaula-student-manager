# ══════════════════════════════════════════════════════════════
# application-demo.properties — PUBLIC SHOWCASE profile
# ══════════════════════════════════════════════════════════════
# Runs the whole backend with zero external services: an in-memory
# H2 database that Hibernate builds from the entities and that
# DemoDataSeeder fills with a small fictional school on every start.
#
# Activate with:  --spring.profiles.active=demo
# Nothing here is secret. Do not point a real database at this profile.

# Honour the port the host injects (Render / Railway / Fly all set $PORT).
server.port=${PORT:8080}

# ── Database: in-memory H2, kept alive for the JVM lifetime ──
spring.datasource.url=jdbc:h2:mem:gaula;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ── Schema comes from the JPA entities, not Flyway ──
# The Flyway migrations under db/migration are MySQL-dialect and have
# drifted from the current entity model, so the demo skips them.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ── JWT: secret still comes from the environment ──
# Render generates one via render.yaml; locally, export GAULA_JWT_SECRET
# (any Base64 string of 512+ bits).
gaula.jwt.secret=${GAULA_JWT_SECRET}
gaula.jwt.expiration-ms=86400000

# ── CORS: allow any origin so the hosted Flutter web build can call in ──
gaula.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://*,https://*}

# ── Profile-photo uploads land in a writable temp dir (ephemeral) ──
file.upload-dir=${UPLOAD_DIR:/tmp/gaula-uploads}

# ── Logging ──
logging.level.root=INFO
logging.level.com.gaula=INFO
logging.level.org.hibernate.SQL=WARN
