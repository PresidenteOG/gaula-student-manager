# ══════════════════════════════════════════════════════════════
# application-dev.properties — Perfil de DESARROLLO
# ══════════════════════════════════════════════════════════════

# Base de datos — configúrala con variables de entorno (ver application.properties).
# Por defecto apunta a un MySQL local.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gaula?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# Consola H2 — desactivada (app usa MySQL/Aiven, no H2)
spring.h2.console.enabled=false

# JPA Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-on-validation-error=false
spring.flyway.validate-on-migrate=false
spring.flyway.ignore-missing-migrations=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# CORS — Permite cualquier origen en dev (LAN, localhost, emulador Android)
# Se usan patrones glob: * cubre cualquier host y puerto en el mismo esquema.
gaula.cors.allowed-origins=http://*,https://*

# Logging — modo silencioso para testing en movil
logging.level.root=WARN
logging.level.org.springframework.security=DEBUG
logging.level.com.gaula=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.boot=WARN
